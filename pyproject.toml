[project]
name = "flow-local"
version = "0.1.0"
description = "FlowLocal — AI Voice Dictation, Hands-Free Assistant (Whis) & Scientific Study Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "imageio-ffmpeg>=0.8.1",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "matplotlib>=3.11.2",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "nvidia-ml-py>=12.535.0; sys_platform == 'win32'",
    "pillow>=13.0.0",
    "psutil>=5.9.0",
    "pycaw>=20240210; sys_platform == 'win32'",
    "pygame>=2.6.1",
    "pymupdf>=2.1",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "PyQt6>=6.6.0",
    "pystray>=0.19.5",
    "python-docx>=1.2.0",
    "pyttsx3>=2.99",
    "qtawesome>=1.4.2",
    "rapidocr-onnxruntime>=1.4.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "tzdata>=2026.6",
]
